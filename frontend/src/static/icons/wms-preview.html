<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>斗南 WMS 图标候选集 0.1.0</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; background: #f4f6f8; color: #20242c; font-family: system-ui, "PingFang SC", sans-serif; }
    h1 { margin: 0; font-size: 24px; } p { margin: 8px 0 24px; color: #7b8492; }
    .grid { display: grid; grid-template-columns: repeat(5, minmax(150px, 1fr)); gap: 12px; }
    .card { padding: 16px; border: 1px solid #e8ebf0; border-radius: 13px; background: #fff; }
    .label { margin-bottom: 12px; font-size: 14px; font-weight: 650; }
    .samples { display: flex; align-items: center; gap: 12px; color: #20242c; }
    .samples img { display: block; color: inherit; }
    .s24 { width: 24px; height: 24px; }.s20 { width: 20px; height: 20px; }.s16 { width: 16px; height: 16px; }
    .dark { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 10px; background: #f2f3f5; }
    .dark img { width: 24px; height: 24px; opacity: .92; }
    .status { margin-top: 10px; color: #7b8492; font-size: 11px; }
  </style>
</head>
<body>
  <h1>斗南 WMS 图标候选集</h1>
  <p>refined outline 0.2.0 · 24 / 20 / 16px · candidate</p>
  <div class="grid" id="grid"></div>
  <script>
    const icons = [
      ['collection','集货'],['truck','运输'],['checkin','到场'],['inspection','质检'],['warehouse','仓库'],
      ['inbound','入库'],['outbound','出库'],['shelf','货架'],['location','货位'],['picking','配货/拣货'],
      ['flower-bunch','花束'],['packing','打包'],['parcel','包裹'],['dispatch','发货'],['scan','扫码'],
      ['stocktake','盘点'],['replenishment','补货'],['return','退货'],['cold-storage','冷库'],['crate','周转筐']
    ]
    document.querySelector('#grid').innerHTML = icons.map(([id,label]) => {
      const src = `wms/fwms-${id}-outline.svg`
      return `<article class="card"><div class="label">${label}</div><div class="samples"><img class="s24" src="${src}"><img class="s20" src="${src}"><img class="s16" src="${src}"><span class="dark"><img src="${src}"></span></div><div class="status">fwms-${id}-outline</div></article>`
    }).join('')
  </script>
</body>
</html>
